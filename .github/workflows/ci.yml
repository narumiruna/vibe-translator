name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 25

      - name: Setup Biome
        uses: biomejs/setup-biome@v2
        with:
          version: 2.4.9

      - name: Run Biome checks
        run: biome ci

      - name: Run check
        run: npm run check
